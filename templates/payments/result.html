{% extends 'base.html' %}
{% block title %}Payment status | NEXT GEN POWER{% endblock %}
{% block content %}<section class="section section-pale checkout-section"><div class="checkout-panel"><p class="eyebrow eyebrow-dark">Charging payment</p><h1>Payment status</h1><div class="notice {% if payment.status == 'succeeded' %}notice-success{% else %}notice-warning{% endif %}"><strong>{{ payment.get_status_display }}</strong><p>Session status: {{ payment.session.get_status_display }}.</p></div><p>Reference {{ payment.public_id }}</p><a class="button button-dark" href="{% url 'charging:station_detail' payment.session.charger.station.slug %}">View station</a></div></section>{% endblock %}
